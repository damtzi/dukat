name: Semgrep

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v6

      - name: Run Semgrep (custom rules)
        run: semgrep scan --config .semgrep/ --error --verbose
        env:
          SEMGREP_RULES: .semgrep/

      - name: Run Semgrep (community security rules)
        run: >
          semgrep scan
          --config p/javascript
          --config p/typescript
          --config p/secrets
          --config p/owasp-top-ten
          --error
          --verbose
        if: always()
