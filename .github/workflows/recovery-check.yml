name: Recovery check

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      backup_date:
        description: UTC backup date (YYYY-MM-DD); defaults to today
        required: false
        type: string

concurrency:
  group: recovery-check
  cancel-in-progress: false

jobs:
  restore-and-verify:
    name: Restore encrypted backup and verify integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download encrypted backup
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_READ_TOKEN }}
          REQUESTED_BACKUP_DATE: ${{ inputs.backup_date }}
        run: |
          backup_date="${REQUESTED_BACKUP_DATE:-$(date -u +%F)}"
          echo "BACKUP_DATE=$backup_date" >> "$GITHUB_ENV"
          pnpm --filter @dukat/server exec wrangler r2 object get \
            "dukat-backups/daily/$backup_date.backup.json" \
            --remote --file "$RUNNER_TEMP/dukat.backup.json"

      - name: Restore into an empty database and verify financial integrity
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          TURSO_DATABASE_URL: file:${{ runner.temp }}/restored.db
        run: pnpm --filter @dukat/db db:restore -- "$RUNNER_TEMP/dukat.backup.json"
