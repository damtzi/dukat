name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ${{ matrix.os-version }}

    strategy:
      matrix:
        node-version: [24.x]
        os-version: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  check-types:
    name: Check types
    runs-on: ${{ matrix.os-version }}

    strategy:
      matrix:
        node-version: [24.x]
        os-version: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check-types

  build:
    name: Build
    runs-on: ${{ matrix.os-version }}
    needs: [lint, check-types]

    strategy:
      matrix:
        node-version: [24.x]
        os-version: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  foundation-tests:
    name: Migration, auth, authorization, and recovery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers for end-to-end tests
        run: |
          pnpm --filter @dukat/e2e exec playwright install --with-deps chromium firefox webkit
          pnpm --filter @dukat/e2e exec playwright install chrome
          pnpm --filter @dukat/e2e exec playwright install msedge

      - name: Run foundation integration tests
        run: pnpm test

      - name: Run built dashboard security smoke test
        run: pnpm --filter @dukat/e2e test:production

      - name: Run real full-stack browser test
        run: pnpm test:e2e:full-stack
