name: Production release migration

on:
  workflow_dispatch:

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create encrypted pre-migration snapshot
        run: pnpm db:backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_PATH: backup/pre-migration-${{ github.run_id }}.backup
      - name: Copy pre-migration snapshot to separate object storage
        run: aws s3 cp "backup/pre-migration-${GITHUB_RUN_ID}.backup" "s3://${BACKUP_BUCKET}/pre-migration/${GITHUB_RUN_ID}.backup" --sse AES256
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_AWS_REGION }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
      - name: Apply checked-in migrations once
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
      - name: Verify database integrity
        run: pnpm db:check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
      - name: Check deployed readiness
        run: curl --fail --retry 12 --retry-delay 5 "${APPLICATION_URL}/health/ready"
        env:
          APPLICATION_URL: ${{ vars.APPLICATION_URL }}
