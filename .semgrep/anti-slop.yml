rules:
  # ── Narrating comments ──────────────────────────────────────────────
  - id: narrating-comment-import
    patterns:
      - pattern-regex: '//\s*(Import|Importing)\s+(the|a|all)\s+'
    message: >
      Remove narrating comment. Comments like "// Import the module" add no value.
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: anti-slop

  - id: narrating-comment-define
    patterns:
      - pattern-regex: '//\s*(Define|Defining|Create|Creating|Declare|Declaring)\s+(the|a|an)\s+'
    message: >
      Remove narrating comment. The code already shows what's being defined.
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: anti-slop

  - id: narrating-comment-return
    patterns:
      - pattern-regex: '//\s*(Return|Returning)\s+(the|a|an)\s+'
    message: >
      Remove narrating comment. "// Return the result" adds no information.
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: anti-slop

  - id: narrating-comment-handle
    patterns:
      - pattern-regex: '//\s*(Handle|Handling|Process|Processing)\s+(the|a|an)\s+'
    message: >
      Remove narrating comment unless it explains non-obvious intent.
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: anti-slop

  - id: narrating-comment-initialize
    patterns:
      - pattern-regex: '//\s*(Initialize|Initializing|Setup|Setting up)\s+(the|a|an)\s+'
    message: >
      Remove narrating comment. Initialization is evident from the code.
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: anti-slop

  - id: narrating-comment-check-if
    patterns:
      - pattern-regex: '//\s*(Check|Checking)\s+(if|whether)\s+'
    message: >
      Remove narrating comment. The conditional below already conveys this.
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: anti-slop

  # ── Empty / swallowed errors ────────────────────────────────────────
  - id: empty-catch-block
    patterns:
      - pattern: |
          try { ... } catch($ERR) { }
    message: >
      Empty catch block silently swallows errors. At minimum log or re-throw.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security

  # ── Hardcoded secrets / credentials ─────────────────────────────────
  - id: hardcoded-secret
    patterns:
      - pattern-regex: '(?i)(password|secret|api_key|apikey|token)\s*[:=]\s*["\x27][^"\x27]{8,}["\x27]'
    paths:
      exclude:
        - '*.test.*'
        - '*.spec.*'
        - '*.example'
        - '**/seed/**'
    message: >
      Possible hardcoded secret. Use environment variables instead.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security

  # ── AI-generated placeholder patterns ───────────────────────────────
  - id: ai-todo-placeholder
    patterns:
      - pattern-regex: '//\s*TODO:?\s*(implement|add|fix|handle|complete)\s+(this|here|later|the rest)'
    message: >
      AI-generated TODO placeholder. Either implement it or remove it.
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: anti-slop

  - id: ai-placeholder-function
    patterns:
      - pattern: |
          function $FN(...) {
            throw new Error("Not implemented");
          }
    message: >
      Placeholder function found. Implement or remove before merging.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: anti-slop

  # ── Convex-specific: unprotected mutations ──────────────────────────
  - id: convex-unprotected-mutation
    patterns:
      - pattern: |
          export const $FN = mutation({
            args: { ... },
            handler: async (ctx, $ARGS) => {
              ...
            }
          });
      - pattern-not: |
          export const $FN = mutation({
            args: { ... },
            handler: async (ctx, $ARGS) => {
              ...
              requireAuthUserId(...)
              ...
            }
          });
      - pattern-not: |
          export const $FN = mutation({
            args: { ... },
            handler: async (ctx, $ARGS) => {
              ...
              requireAuthUser(...)
              ...
            }
          });
      - pattern-not: |
          export const $FN = mutation({
            args: { ... },
            handler: async (ctx, $ARGS) => {
              ...
              requireAdmin(...)
              ...
            }
          });
    paths:
      include:
        - '**/packages/backend/convex/**'
    message: >
      Mutation "$FN" has no auth check. Add requireAuthUserId(), requireAuthUser(), or requireAdmin().
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security

  - id: convex-unprotected-query
    patterns:
      - pattern: |
          export const $FN = query({
            args: { ... },
            handler: async (ctx, $ARGS) => {
              ...
            }
          });
      - pattern-not: |
          export const $FN = query({
            args: { ... },
            handler: async (ctx, $ARGS) => {
              ...
              requireAuthUserId(...)
              ...
            }
          });
      - pattern-not: |
          export const $FN = query({
            args: { ... },
            handler: async (ctx, $ARGS) => {
              ...
              requireAuthUser(...)
              ...
            }
          });
      - pattern-not: |
          export const $FN = query({
            args: { ... },
            handler: async (ctx, $ARGS) => {
              ...
              requireAdmin(...)
              ...
            }
          });
      - pattern-not: |
          export const $FN = query({
            args: { ... },
            handler: async (ctx, $ARGS) => {
              ...
              getAuthUser(...)
              ...
            }
          });
    paths:
      include:
        - '**/packages/backend/convex/**'
      exclude:
        - '**/packages/backend/convex/auth.ts'
        - '**/packages/backend/convex/auth.config.ts'
    message: >
      Query "$FN" has no auth check. Ensure this is intentional — if not, add requireAuthUserId().
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: security

  # ── Unsafe patterns ─────────────────────────────────────────────────
  - id: eval-usage
    patterns:
      - pattern: eval(...)
    message: >
      Never use eval(). It enables arbitrary code execution.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security

  - id: innerhtml-xss
    patterns:
      - pattern-regex: 'innerHTML\s*='
    message: >
      Direct innerHTML assignment risks XSS. Use textContent or a sanitizer.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security

  # ── Code quality ────────────────────────────────────────────────────
  - id: no-explicit-any
    patterns:
      - pattern-regex: ':\s*any\b'
    paths:
      exclude:
        - '*.d.ts'
        - '**/generated/**'
        - '**/_generated/**'
        - '**/utils.ts'
    message: >
      Avoid explicit "any" type. Use a specific type or "unknown" instead.
    languages: [typescript]
    severity: WARNING
    metadata:
      category: anti-slop

  - id: no-non-null-assertion-chain
    patterns:
      - pattern-regex: '\w+!\.\w+!\.'
    message: >
      Chained non-null assertions (a!.b!.c) are fragile. Add proper null checks.
    languages: [typescript]
    severity: WARNING
    metadata:
      category: anti-slop
